<div class="container">
  <div class="breadcrumb">
    <a routerLink="/">Account</a> / <a routerLink="/account">My Account</a> / <a routerLink="/cart">View Cart</a> /
    <span class="current">CheckOut</span>
  </div>

  <div *ngIf="placedOrder" class="success">✅ Order placed successfully! Redirecting home...</div>

  <div class="checkout-grid" *ngIf="!placedOrder">
    <form class="billing-form" [formGroup]="form" (ngSubmit)="placeOrder()">
      <h2>Billing Details</h2>

      <label>First Name*</label>
      <input class="form-control-box" formControlName="firstName" />

      <label>Company Name</label>
      <input class="form-control-box" formControlName="companyName" />

      <label>Street Address*</label>
      <input class="form-control-box" formControlName="streetAddress" />

      <label>Apartment, floor, etc. (optional)</label>
      <input class="form-control-box" formControlName="apartment" />

      <label>Town/City*</label>
      <input class="form-control-box" formControlName="townCity" />

      <label>Phone Number*</label>
      <input class="form-control-box" formControlName="phone" />

      <label>Email Address*</label>
      <input class="form-control-box" formControlName="email" />

      <label class="checkbox-row">
        <input type="checkbox" formControlName="saveInfo" />
        Save this information for faster check-out next time
      </label>
    </form>

    <aside class="order-summary">
      <div class="order-item" *ngFor="let item of items">
        <img [src]="item.product.image" [alt]="item.product.title" />
        <span>{{ item.product.title }} × {{ item.quantity }}</span>
        <span>${{ (item.product.price * item.quantity).toFixed(2) }}</span>
      </div>

      <div class="row"><span>Subtotal:</span><span>${{ subtotal.toFixed(2) }}</span></div>
      <div class="row"><span>Shipping:</span><span>Free</span></div>
      <div class="row total"><span>Total:</span><span>${{ subtotal.toFixed(2) }}</span></div>

      <label class="radio-row">
        <input type="radio" name="payment" [checked]="paymentMethod === 'bank'" (change)="paymentMethod = 'bank'" />
        Bank
      </label>
      <label class="radio-row">
        <input type="radio" name="payment" [checked]="paymentMethod === 'cod'" (change)="paymentMethod = 'cod'" />
        Cash on delivery
      </label>

      <div class="coupon">
        <input type="text" placeholder="Coupon Code" />
        <button type="button" class="btn btn-primary">Apply Coupon</button>
      </div>

      <button class="btn btn-primary full" type="submit" (click)="placeOrder()" [disabled]="items.length === 0">
        Place Order
      </button>
    </aside>
  </div>
</div>

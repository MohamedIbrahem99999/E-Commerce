<div class="container">
  <div class="header-row">
    <h2>Wishlist ({{ items.length }})</h2>
    <button class="btn btn-outline" *ngIf="items.length" (click)="moveAllToBag()">Move All To Bag</button>
  </div>

  <div *ngIf="items.length === 0" class="empty">
    <p>Your wishlist is empty.</p>
    <a routerLink="/" class="btn btn-primary">Browse Products</a>
  </div>

  <div class="grid grid-4" *ngIf="items.length">
    <div class="wish-card" *ngFor="let p of items">
      <div class="thumb">
        <img [src]="p.image" [alt]="p.title" />
        <button class="del-btn" (click)="remove(p.id)">🗑</button>
        <button class="add-cart-btn" (click)="addToCart(p)">Add To Cart</button>
      </div>
      <h4>{{ p.title }}</h4>
      <div class="price">${{ p.price }}</div>
    </div>
  </div>

  <section class="suggestions" *ngIf="suggestions.length">
    <div class="section-title"><span class="bar"></span><span>Just For You</span></div>
    <div class="grid grid-4">
      <div class="wish-card" *ngFor="let p of suggestions">
        <div class="thumb">
          <img [src]="p.image" [alt]="p.title" />
          <button class="add-cart-btn" (click)="addToCart(p)">Add To Cart</button>
        </div>
        <h4>{{ p.title }}</h4>
        <div class="price">${{ p.price }}</div>
      </div>
    </div>
  </section>
</div>

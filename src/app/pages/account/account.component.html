<div class="container">
  <div class="top-row">
    <div class="breadcrumb"><a routerLink="/">Home</a> / <span class="current">My Account</span></div>
    <span class="welcome">Welcome! <strong>Mohamed Ibrahem</strong></span>
  </div>

  <div class="account-grid">
    <aside class="account-nav">
      <h4>Manage My Account</h4>
      <ul>
        <li class="active">My Profile</li>
        <li>Address Book</li>
        <li>My Payment Options</li>
      </ul>

      <h4>My Orders</h4>
      <ul>
        <li>My Returns</li>
        <li>My Cancellations</li>
      </ul>

      <h4><a routerLink="/wishlist">My WishList</a></h4>
    </aside>

    <div class="profile-card">
      <h2>Edit Your Profile</h2>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="row-2">
          <div>
            <label>First Name</label>
            <input class="form-control-box" formControlName="firstName" />
          </div>
          <div>
            <label>Last Name</label>
            <input class="form-control-box" formControlName="lastName" />
          </div>
        </div>

        <div class="row-2">
          <div>
            <label>Email</label>
            <input class="form-control-box" formControlName="email" />
          </div>
          <div>
            <label>Address</label>
            <input class="form-control-box" formControlName="address" />
          </div>
        </div>

        <label>Password Changes</label>
        <input class="form-control-box" type="password" placeholder="Current Password" formControlName="currentPassword" />
        <input class="form-control-box" type="password" placeholder="New Password" formControlName="newPassword" />
        <input class="form-control-box" type="password" placeholder="Confirm New Password" formControlName="confirmPassword" />

        <div class="actions">
          <span class="saved" *ngIf="saved">Saved!</span>
          <button type="button" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

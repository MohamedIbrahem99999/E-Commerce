
<div class="container py-5">
  <div class="row align-items-center g-4 g-lg-5">
    
    <!-- Left Column: Image / Graphic -->
    <div class="col-12 col-md-6 d-none d-md-flex align-items-center justify-content-center bg-info-subtle rounded-3 min-vh-50" style="min-height: 480px;">
      <div class="display-1">🛒📱🛍️</div>
    </div>

    <!-- Right Column: Form -->
    <div class="col-12 col-md-6">
      <div class="w-100 style-form-wrapper px-md-3">
        <h1 class="fw-bold mb-2">Create an account</h1>
        <p class="text-muted mb-4">Enter your details below</p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="d-flex flex-column gap-3">
          
          <div>
            <input class="form-control form-control-lg" placeholder="Name" formControlName="name" />
            <div class="text-danger small mt-1" *ngIf="submitted && form.get('name')?.invalid">
              Name is required
            </div>
          </div>

          <div>
            <input class="form-control form-control-lg" placeholder="Email or Phone Number" formControlName="identifier" />
            <div class="text-danger small mt-1" *ngIf="submitted && form.get('identifier')?.invalid">
              This field is required
            </div>
          </div>

          <div>
            <input class="form-control form-control-lg" type="password" placeholder="Password" formControlName="password" />
            <div class="text-danger small mt-1" *ngIf="submitted && form.get('password')?.invalid">
              Minimum 6 characters
            </div>
          </div>

          <button class="btn btn-danger btn-lg w-100 mt-2" type="submit">
            Create Account
          </button>
          
          <button class="btn btn-outline-dark btn-lg w-100" type="button">
            🔴 Sign up with Google
          </button>
        </form>

        <p class="text-muted mt-4 text-center text-md-start">
          Already have account? 
          <a routerLink="/login" class="text-dark fw-semibold text-decoration-underline ms-1">Log in</a>
        </p>
      </div>
    </div>

  </div>
</div>
